"""
Zoho Desk GraphQL Schema
Conceptual schema derived from the Zoho Desk REST API.
Reference: https://desk.zoho.com/DeskAPIDocument
"""

# ─── Scalars ─────────────────────────────────────────────────────────────────

scalar DateTime
scalar JSON
scalar URL

# ─── Enums ───────────────────────────────────────────────────────────────────

enum TicketStatus {
  OPEN
  ON_HOLD
  ESCALATED
  CLOSED
  RESOLVED
}

enum TicketPriority {
  LOW
  MEDIUM
  HIGH
  URGENT
}

enum TicketChannel {
  EMAIL
  PHONE
  CHAT
  SOCIAL
  WEB_FORM
  FEEDBACK_WIDGET
  COMMUNITY
  API
  TWITTER
  FACEBOOK
}

enum ThreadType {
  PUBLIC
  PRIVATE
  EMAIL
  NOTE
  CALL
  CHAT
}

enum AgentRole {
  AGENT
  ADMIN
  SUPERVISOR
  LIGHT_AGENT
}

enum ArticleStatus {
  DRAFT
  PUBLISHED
  ARCHIVED
}

enum ReportType {
  TICKET_VOLUME
  AGENT_PERFORMANCE
  RESPONSE_TIME
  RESOLUTION_TIME
  CUSTOMER_SATISFACTION
  FIRST_CONTACT_RESOLUTION
  SLA_COMPLIANCE
}

enum WebhookEvent {
  TICKET_CREATED
  TICKET_UPDATED
  TICKET_CLOSED
  TICKET_REOPENED
  TICKET_DELETED
  REPLY_CREATED
  NOTE_CREATED
  CONTACT_CREATED
  CONTACT_UPDATED
  AGENT_CREATED
}

enum TimelineEventType {
  TICKET_CREATED
  STATUS_CHANGED
  PRIORITY_CHANGED
  ASSIGNEE_CHANGED
  REPLY_SENT
  NOTE_ADDED
  TAG_ADDED
  TAG_REMOVED
  FIELD_UPDATED
  MERGED
  SPLIT
  REOPENED
  CLOSED
}

enum CustomFieldType {
  TEXT
  MULTI_LINE
  NUMBER
  DECIMAL
  EMAIL
  PHONE
  DATE
  DATE_TIME
  CHECKBOX
  DROPDOWN
  MULTI_SELECT
  URL
  LOOKUP
}

# ─── Core Ticket Types ────────────────────────────────────────────────────────

type Ticket {
  id: ID!
  ticketNumber: String!
  subject: String!
  description: String
  status: TicketStatus!
  priority: TicketPriority!
  channel: TicketChannel!
  category: TicketCategory
  subCategory: TicketSubCategory
  contact: Contact
  account: Account
  department: Department
  assignee: Agent
  team: Team
  product: Product
  dueDate: DateTime
  closedTime: DateTime
  createdTime: DateTime!
  modifiedTime: DateTime!
  isOverdue: Boolean!
  isEscalated: Boolean!
  isSpam: Boolean!
  isTrashed: Boolean!
  tags: [String!]
  customFields: JSON
  threads: [TicketThread!]
  replies: [TicketReply!]
  notes: [TicketNote!]
  attachments: [Attachment!]
  timeEntries: [TicketTimeEntry!]
  timeline: [TimelineEvent!]
  sla: SLA
}

type TicketDetails {
  ticket: Ticket!
  threadCount: Int!
  replyCount: Int!
  noteCount: Int!
  attachmentCount: Int!
  timeSpent: Int
  firstResponseTime: DateTime
  resolutionTime: DateTime
  customerResponseTime: DateTime
  agentResponseTime: DateTime
}

type TicketCategory {
  id: ID!
  name: String!
  department: Department
}

type TicketSubCategory {
  id: ID!
  name: String!
  category: TicketCategory!
}

type TicketThread {
  id: ID!
  ticket: Ticket!
  type: ThreadType!
  content: ThreadContent!
  author: Agent
  contact: Contact
  createdTime: DateTime!
  attachments: [Attachment!]
  isEdited: Boolean!
}

type TicketReply {
  id: ID!
  ticket: Ticket!
  content: String!
  fromEmailAddress: String
  toEmailAddresses: [String!]
  ccEmailAddresses: [String!]
  bccEmailAddresses: [String!]
  author: Agent
  createdTime: DateTime!
  attachments: [Attachment!]
  isForward: Boolean!
}

type TicketNote {
  id: ID!
  ticket: Ticket!
  content: String!
  author: Agent!
  createdTime: DateTime!
  modifiedTime: DateTime!
  attachments: [Attachment!]
  isPublic: Boolean!
  mentions: [Agent!]
}

type TicketTimeEntry {
  id: ID!
  ticket: Ticket!
  agent: Agent!
  timeSpent: Int!
  billingType: String
  executedTime: DateTime!
  note: String
  isBillable: Boolean!
}

# ─── Thread Types ─────────────────────────────────────────────────────────────

type Thread {
  id: ID!
  type: ThreadType!
  summary: String
  createdTime: DateTime!
  ticket: Ticket!
}

type ThreadDetails {
  thread: Thread!
  content: ThreadContent!
  attachments: [Attachment!]
  author: Agent
  contact: Contact
}

type ThreadContent {
  type: String!
  body: String!
  htmlBody: String
}

type EmailThread {
  id: ID!
  subject: String!
  fromEmailAddress: String!
  toEmailAddresses: [String!]!
  ccEmailAddresses: [String!]
  bccEmailAddresses: [String!]
  content: String!
  createdTime: DateTime!
  attachments: [Attachment!]
  ticket: Ticket!
}

# ─── Reply and Note Types ─────────────────────────────────────────────────────

type Reply {
  id: ID!
  content: String!
  ticket: Ticket!
  author: Agent
  createdTime: DateTime!
  modifiedTime: DateTime!
}

type Note {
  id: ID!
  content: String!
  ticket: Ticket!
  author: Agent!
  isPublic: Boolean!
  createdTime: DateTime!
  modifiedTime: DateTime!
}

type NoteDetails {
  note: Note!
  attachments: [Attachment!]
  mentions: [Agent!]
}

# ─── Attachment ───────────────────────────────────────────────────────────────

type Attachment {
  id: ID!
  name: String!
  size: Int!
  mimeType: String!
  href: URL
  createdTime: DateTime!
  ticket: Ticket
  thread: Thread
}

# ─── Contact Types ────────────────────────────────────────────────────────────

type Contact {
  id: ID!
  firstName: String
  lastName: String
  fullName: String
  email: String
  phone: String
  mobile: String
  account: Account
  department: String
  title: String
  description: String
  createdTime: DateTime!
  modifiedTime: DateTime!
  customFields: JSON
  tickets: [Ticket!]
  phones: [ContactPhone!]
  emails: [ContactEmail!]
}

type ContactDetails {
  contact: Contact!
  ticketCount: Int!
  openTicketCount: Int!
  closedTicketCount: Int!
  averageSatisfactionRating: Float
  tags: [String!]
}

type ContactEmail {
  email: String!
  isPrimary: Boolean!
  isVerified: Boolean!
}

type ContactPhone {
  number: String!
  type: String
  isPrimary: Boolean!
}

# ─── Account Types ────────────────────────────────────────────────────────────

type Account {
  id: ID!
  accountName: String!
  website: URL
  phone: String
  description: String
  industry: AccountIndustry
  annualRevenue: Float
  numberOfEmployees: Int
  createdTime: DateTime!
  modifiedTime: DateTime!
  customFields: JSON
  contacts: [Contact!]
  tickets: [Ticket!]
}

type AccountDetails {
  account: Account!
  contactCount: Int!
  ticketCount: Int!
  openTicketCount: Int!
  totalSpend: Float
}

type AccountIndustry {
  id: ID!
  name: String!
}

# ─── Knowledge Base Types ─────────────────────────────────────────────────────

type Article {
  id: ID!
  title: String!
  content: String!
  status: ArticleStatus!
  permalink: String
  category: ArticleCategory
  department: Department
  author: Agent
  views: Int!
  upVotes: Int!
  downVotes: Int!
  createdTime: DateTime!
  modifiedTime: DateTime!
  publishedTime: DateTime
  tags: [String!]
  attachments: [Attachment!]
  comments: [Comment!]
}

type ArticleDetails {
  article: Article!
  relatedArticles: [Article!]
  commentCount: Int!
  averageRating: Float
}

type ArticleCategory {
  id: ID!
  name: String!
  description: String
  parentCategory: ArticleCategory
  subCategories: [ArticleCategory!]
  articles: [Article!]
  department: Department
}

type Comment {
  id: ID!
  content: String!
  author: Contact
  article: Article!
  createdTime: DateTime!
  modifiedTime: DateTime!
  isApproved: Boolean!
}

# ─── Department and Organization Types ───────────────────────────────────────

type Department {
  id: ID!
  name: String!
  description: String
  isDefault: Boolean!
  createdTime: DateTime!
  agents: [Agent!]
  teams: [Team!]
}

type DepartmentDetails {
  department: Department!
  agentCount: Int!
  teamCount: Int!
  ticketCount: Int!
  openTicketCount: Int!
}

# ─── Agent Types ─────────────────────────────────────────────────────────────

type Agent {
  id: ID!
  firstName: String
  lastName: String
  displayName: String!
  email: String!
  phone: String
  role: AgentRole!
  departments: [Department!]
  teams: [Team!]
  isActive: Boolean!
  isAvailable: Boolean!
  createdTime: DateTime!
  modifiedTime: DateTime!
  customFields: JSON
}

type AgentDetails {
  agent: Agent!
  ticketCount: Int!
  openTicketCount: Int!
  closedTicketCount: Int!
  averageFirstResponseTime: Float
  averageResolutionTime: Float
  satisfactionRating: Float
}

# ─── Team Types ───────────────────────────────────────────────────────────────

type Team {
  id: ID!
  name: String!
  description: String
  department: Department
  members: [TeamMembership!]
  createdTime: DateTime!
  modifiedTime: DateTime!
}

type TeamDetails {
  team: Team!
  memberCount: Int!
  ticketCount: Int!
  openTicketCount: Int!
}

type TeamMembership {
  id: ID!
  team: Team!
  agent: Agent!
  isLeader: Boolean!
  joinedTime: DateTime!
}

# ─── SLA Types ────────────────────────────────────────────────────────────────

type SLA {
  id: ID!
  name: String!
  description: String
  policies: [SLAPolicy!]!
  department: Department
  isActive: Boolean!
  createdTime: DateTime!
  modifiedTime: DateTime!
}

type SLADetails {
  sla: SLA!
  ticketCount: Int!
  breachedTicketCount: Int!
  complianceRate: Float!
}

type SLAPolicy {
  id: ID!
  sla: SLA!
  priority: TicketPriority!
  firstResponseHours: Int
  resolutionHours: Int
  everyResponseHours: Int
  operationalHours: String
}

# ─── Product Types ────────────────────────────────────────────────────────────

type Product {
  id: ID!
  name: String!
  description: String
  isActive: Boolean!
  createdTime: DateTime!
  modifiedTime: DateTime!
  department: Department
}

# ─── Configuration Types ──────────────────────────────────────────────────────

type Category {
  id: ID!
  name: String!
  department: Department
}

type Status {
  id: ID!
  name: String!
  type: String!
  isDefault: Boolean!
  department: Department
}

type Priority {
  id: ID!
  name: String!
  level: Int!
  color: String
}

type Channel {
  id: ID!
  name: String!
  type: TicketChannel!
  isActive: Boolean!
}

# ─── Form and Widget Types ────────────────────────────────────────────────────

type Form {
  id: ID!
  name: String!
  description: String
  department: Department
  fields: [FormField!]!
  isActive: Boolean!
  createdTime: DateTime!
}

type FormField {
  id: ID!
  form: Form!
  label: String!
  apiName: String!
  type: CustomFieldType!
  isRequired: Boolean!
  isVisible: Boolean!
  defaultValue: String
  options: [String!]
  position: Int!
}

type Widget {
  id: ID!
  name: String!
  type: String!
  config: WidgetConfig!
  department: Department
  isActive: Boolean!
  createdTime: DateTime!
}

type WidgetConfig {
  widget: Widget!
  theme: String
  language: String
  allowedDomains: [String!]
  customCSS: String
  features: JSON
}

# ─── Integration Types ────────────────────────────────────────────────────────

type Integration {
  id: ID!
  name: String!
  type: String!
  isActive: Boolean!
  createdTime: DateTime!
  config: JSON
}

type ZohoCRM {
  id: ID!
  isConnected: Boolean!
  syncedAt: DateTime
  accountMapping: JSON
  contactMapping: JSON
  ticketMapping: JSON
}

# ─── Webhook Types ────────────────────────────────────────────────────────────

type Webhook {
  id: ID!
  name: String!
  url: URL!
  events: [WebhookEvent!]!
  isActive: Boolean!
  secret: String
  createdTime: DateTime!
  modifiedTime: DateTime!
  headers: JSON
  department: Department
}

# ─── Report Types ─────────────────────────────────────────────────────────────

type Report {
  id: ID!
  name: String!
  type: ReportType!
  description: String
  createdTime: DateTime!
  modifiedTime: DateTime!
  filters: JSON
  data: JSON
}

# ─── Timeline Types ───────────────────────────────────────────────────────────

type Timeline {
  ticket: Ticket!
  events: [TimelineEvent!]!
  totalCount: Int!
}

type TimelineEvent {
  id: ID!
  type: TimelineEventType!
  description: String!
  performedBy: Agent
  createdTime: DateTime!
  oldValue: String
  newValue: String
  ticket: Ticket!
}

# ─── Custom Field Types ───────────────────────────────────────────────────────

type CustomField {
  id: ID!
  label: String!
  apiName: String!
  type: CustomFieldType!
  isRequired: Boolean!
  isVisible: Boolean!
  defaultValue: String
  options: [String!]
  module: String!
  createdTime: DateTime!
}

# ─── API Key / Token Types ────────────────────────────────────────────────────

type APIKey {
  id: ID!
  name: String!
  keyPrefix: String!
  createdTime: DateTime!
  expiresAt: DateTime
  isActive: Boolean!
  scopes: [String!]!
}

type Token {
  accessToken: String!
  refreshToken: String
  tokenType: String!
  expiresIn: Int!
  scope: String!
}

# ─── Pagination ───────────────────────────────────────────────────────────────

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
  totalCount: Int!
}

type TicketConnection {
  nodes: [Ticket!]!
  pageInfo: PageInfo!
}

type ContactConnection {
  nodes: [Contact!]!
  pageInfo: PageInfo!
}

type AccountConnection {
  nodes: [Account!]!
  pageInfo: PageInfo!
}

type ArticleConnection {
  nodes: [Article!]!
  pageInfo: PageInfo!
}

type AgentConnection {
  nodes: [Agent!]!
  pageInfo: PageInfo!
}

# ─── Input Types ─────────────────────────────────────────────────────────────

input TicketFilterInput {
  status: [TicketStatus!]
  priority: [TicketPriority!]
  channel: [TicketChannel!]
  departmentId: ID
  assigneeId: ID
  teamId: ID
  contactId: ID
  accountId: ID
  createdAfter: DateTime
  createdBefore: DateTime
  isOverdue: Boolean
  tags: [String!]
}

input CreateTicketInput {
  subject: String!
  description: String
  status: TicketStatus
  priority: TicketPriority
  channel: TicketChannel
  contactId: ID
  accountId: ID
  departmentId: ID
  assigneeId: ID
  teamId: ID
  dueDate: DateTime
  tags: [String!]
  customFields: JSON
}

input UpdateTicketInput {
  subject: String
  description: String
  status: TicketStatus
  priority: TicketPriority
  assigneeId: ID
  teamId: ID
  dueDate: DateTime
  tags: [String!]
  customFields: JSON
}

input CreateContactInput {
  firstName: String
  lastName: String
  email: String
  phone: String
  accountId: ID
  title: String
  description: String
  customFields: JSON
}

input CreateReplyInput {
  ticketId: ID!
  content: String!
  toEmailAddresses: [String!]
  ccEmailAddresses: [String!]
  bccEmailAddresses: [String!]
}

input CreateNoteInput {
  ticketId: ID!
  content: String!
  isPublic: Boolean
  mentionedAgentIds: [ID!]
}

# ─── Root Types ───────────────────────────────────────────────────────────────

type Query {
  # Tickets
  ticket(id: ID!): Ticket
  ticketDetails(id: ID!): TicketDetails
  tickets(filter: TicketFilterInput, first: Int, after: String): TicketConnection!
  myTickets(status: TicketStatus, first: Int, after: String): TicketConnection!

  # Threads
  ticketThreads(ticketId: ID!): [TicketThread!]!
  emailThread(id: ID!): EmailThread

  # Contacts
  contact(id: ID!): Contact
  contactDetails(id: ID!): ContactDetails
  contacts(query: String, first: Int, after: String): ContactConnection!

  # Accounts
  account(id: ID!): Account
  accountDetails(id: ID!): AccountDetails
  accounts(query: String, first: Int, after: String): AccountConnection!

  # Agents
  agent(id: ID!): Agent
  agentDetails(id: ID!): AgentDetails
  agents(departmentId: ID, first: Int, after: String): AgentConnection!

  # Departments
  department(id: ID!): Department
  departmentDetails(id: ID!): DepartmentDetails
  departments: [Department!]!

  # Teams
  team(id: ID!): Team
  teamDetails(id: ID!): TeamDetails
  teams(departmentId: ID): [Team!]!

  # Knowledge Base
  article(id: ID!): Article
  articleDetails(id: ID!): ArticleDetails
  articles(categoryId: ID, status: ArticleStatus, first: Int, after: String): ArticleConnection!
  articleCategories(departmentId: ID): [ArticleCategory!]!

  # Products
  products(departmentId: ID): [Product!]!
  product(id: ID!): Product

  # SLA
  sla(id: ID!): SLA
  slaDetails(id: ID!): SLADetails
  slas: [SLA!]!

  # Configuration
  categories(departmentId: ID): [Category!]!
  statuses(departmentId: ID): [Status!]!
  priorities: [Priority!]!
  channels: [Channel!]!
  customFields(module: String!): [CustomField!]!

  # Forms and Widgets
  forms(departmentId: ID): [Form!]!
  form(id: ID!): Form
  widgets: [Widget!]!
  widget(id: ID!): Widget

  # Reports
  reports: [Report!]!
  report(id: ID!): Report

  # Integrations
  zohoCRM: ZohoCRM
  webhooks: [Webhook!]!
  webhook(id: ID!): Webhook

  # Timeline
  ticketTimeline(ticketId: ID!): Timeline!
}

type Mutation {
  # Tickets
  createTicket(input: CreateTicketInput!): Ticket!
  updateTicket(id: ID!, input: UpdateTicketInput!): Ticket!
  closeTicket(id: ID!): Ticket!
  reopenTicket(id: ID!): Ticket!
  deleteTicket(id: ID!): Boolean!
  assignTicket(id: ID!, agentId: ID!): Ticket!
  mergeTickets(sourceId: ID!, targetId: ID!): Ticket!

  # Replies and Notes
  createReply(input: CreateReplyInput!): TicketReply!
  createNote(input: CreateNoteInput!): TicketNote!

  # Contacts
  createContact(input: CreateContactInput!): Contact!
  updateContact(id: ID!, input: CreateContactInput!): Contact!
  deleteContact(id: ID!): Boolean!

  # Webhooks
  createWebhook(name: String!, url: URL!, events: [WebhookEvent!]!, departmentId: ID): Webhook!
  updateWebhook(id: ID!, isActive: Boolean): Webhook!
  deleteWebhook(id: ID!): Boolean!
}

type Subscription {
  ticketCreated(departmentId: ID): Ticket!
  ticketUpdated(id: ID): Ticket!
  ticketClosed(departmentId: ID): Ticket!
  replyCreated(ticketId: ID!): TicketReply!
  noteCreated(ticketId: ID!): TicketNote!
}
