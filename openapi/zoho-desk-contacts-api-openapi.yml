openapi: 3.2.0
info:
  title: Zoho Desk Contacts API
  description: REST API for Zoho Desk, covering tickets, contacts, and agents.
  version: v1
servers:
- url: https://desk.zoho.com/api/v1
  description: Production
security:
- ZohoOAuth: []
tags:
- name: Contacts
paths:
  /contacts:
    get:
      summary: List contacts
      operationId: listContacts
      responses:
        '200':
          description: OK
      tags:
      - Contacts
    post:
      summary: Create a contact
      operationId: createContact
      responses:
        '201':
          description: Created
      tags:
      - Contacts
  /contacts/{contact_id}:
    parameters:
    - name: contact_id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Get a contact
      operationId: getContact
      responses:
        '200':
          description: OK
      tags:
      - Contacts
    put:
      summary: Update a contact
      operationId: updateContact
      responses:
        '200':
          description: OK
      tags:
      - Contacts
    delete:
      summary: Delete a contact
      operationId: deleteContact
      responses:
        '200':
          description: OK
      tags:
      - Contacts
components:
  securitySchemes:
    ZohoOAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'OAuth 2.0 access token sent as ''Authorization: Zoho-oauthtoken {access_token}''. Requests also require an orgId header.'
